<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<meta name="referrer" content="no-referrer">
<title>OpenTVPN</title>
<link rel="stylesheet" href="panel.css">
<script src="noble.js" defer></script>
<script src="panel.js" defer></script>
</head>
<body>
<svg class="web" viewBox="0 0 400 260" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <g stroke="rgba(75,227,161,.35)" stroke-width=".8" fill="none"><path d="M232 46L284 22L338 58L392 34M284 22L300 92L338 58M300 92L360 124L392 96M232 46L250 118L300 92M250 118L206 150M360 124L338 176"/></g>
  <g fill="rgba(160,245,210,.7)"><circle cx="232" cy="46" r="1.8"/><circle cx="284" cy="22" r="1.8"/><circle cx="338" cy="58" r="2.2"/><circle cx="392" cy="34" r="1.6"/><circle cx="300" cy="92" r="1.8"/><circle cx="360" cy="124" r="1.8"/><circle cx="392" cy="96" r="1.6"/><circle cx="250" cy="118" r="1.6"/><circle cx="206" cy="150" r="1.4"/><circle cx="338" cy="176" r="1.4"/></g>
</svg>
<header class="top">
  <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3F6F8" stroke-width="2" stroke-linecap="round"><path d="M4 20v-9a8 8 0 0 1 16 0v9"/><path d="M8.5 20v-8a3.5 3.5 0 0 1 7 0v8"/></svg></span>
  <span class="brand"><b id="app">OpenTVPN</b><small id="tv">Phone panel</small></span>
  <span class="live" id="live" hidden><i></i><span></span></span>
</header>
<main id="main"><p class="lede">Loading…</p></main>
<div class="tray" id="tray" hidden><div><b id="trayText"></b><button class="btn ghost" id="discard" type="button">Discard</button><button class="btn go" id="review" type="button">Review</button></div></div>
<nav class="tabs" id="tabs" hidden><div>
  <button type="button" data-tab="status"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/></svg>Status</button>
  <button type="button" data-tab="profiles"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6" rx="2"/><rect x="3.5" y="14" width="17" height="6" rx="2"/></svg>Profiles</button>
  <button type="button" data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  <button type="button" data-tab="log"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></svg>Log</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
